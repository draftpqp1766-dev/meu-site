<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VANTA | Seu Espaço</title>

<style>
* {
    margin: 0;
        padding: 0;
            box-sizing: border-box;
            }

            html {
                scroll-behavior: smooth;
                }

                body {
                    font-family: Arial, Helvetica, sans-serif;
                        background: #080607;
                            color: white;
                                overflow-x: hidden;
                                }

                                /* FUNDO */

                                body::before {
                                    content: "";
                                        position: fixed;
                                            width: 500px;
                                                height: 500px;
                                                    background: #6d1028;
                                                        filter: blur(150px);
                                                            opacity: 0.25;
                                                                top: -200px;
                                                                    left: -150px;
                                                                        z-index: -2;
                                                                        }

                                                                        body::after {
                                                                            content: "";
                                                                                position: fixed;
                                                                                    width: 450px;
                                                                                        height: 450px;
                                                                                            background: #350914;
                                                                                                filter: blur(130px);
                                                                                                    opacity: 0.35;
                                                                                                        right: -150px;
                                                                                                            bottom: -150px;
                                                                                                                z-index: -2;
                                                                                                                }

                                                                                                                /* PARTICULAS */

                                                                                                                .particles {
                                                                                                                    position: fixed;
                                                                                                                        inset: 0;
                                                                                                                            pointer-events: none;
                                                                                                                                z-index: -1;
                                                                                                                                }

                                                                                                                                .particle {
                                                                                                                                    position: absolute;
                                                                                                                                        width: 3px;
                                                                                                                                            height: 3px;
                                                                                                                                                background: #ff6b8a;
                                                                                                                                                    border-radius: 50%;
                                                                                                                                                        opacity: 0.5;
                                                                                                                                                            animation: float 8s infinite ease-in-out;
                                                                                                                                                            }

                                                                                                                                                            @keyframes float {
                                                                                                                                                                0%, 100% {
                                                                                                                                                                        transform: translateY(0);
                                                                                                                                                                                opacity: 0.2;
                                                                                                                                                                                    }

                                                                                                                                                                                        50% {
                                                                                                                                                                                                transform: translateY(-40px);
                                                                                                                                                                                                        opacity: 0.8;
                                                                                                                                                                                                            }
                                                                                                                                                                                                            }

                                                                                                                                                                                                            /* NAVBAR */

                                                                                                                                                                                                            nav {
                                                                                                                                                                                                                position: fixed;
                                                                                                                                                                                                                    top: 18px;
                                                                                                                                                                                                                        left: 50%;
                                                                                                                                                                                                                            transform: translateX(-50%);
                                                                                                                                                                                                                                width: min(92%, 1000px);
                                                                                                                                                                                                                                    padding: 14px 22px;

                                                                                                                                                                                                                                        display: flex;
                                                                                                                                                                                                                                            justify-content: space-between;
                                                                                                                                                                                                                                                align-items: center;

                                                                                                                                                                                                                                                    background: rgba(20, 12, 15, 0.72);
                                                                                                                                                                                                                                                        border: 1px solid rgba(255,255,255,0.08);
                                                                                                                                                                                                                                                            border-radius: 18px;

                                                                                                                                                                                                                                                                backdrop-filter: blur(15px);
                                                                                                                                                                                                                                                                    -webkit-backdrop-filter: blur(15px);

                                                                                                                                                                                                                                                                        z-index: 100;
                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                        .logo {
                                                                                                                                                                                                                                                                            font-size: 22px;
                                                                                                                                                                                                                                                                                font-weight: bold;
                                                                                                                                                                                                                                                                                    letter-spacing: 3px;
                                                                                                                                                                                                                                                                                        color: #ff5c7a;
                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                        .nav-links {
                                                                                                                                                                                                                                                                                            display: flex;
                                                                                                                                                                                                                                                                                                gap: 25px;
                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                .nav-links a {
                                                                                                                                                                                                                                                                                                    color: #ccc;
                                                                                                                                                                                                                                                                                                        text-decoration: none;
                                                                                                                                                                                                                                                                                                            font-size: 14px;
                                                                                                                                                                                                                                                                                                                transition: 0.3s;
                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                .nav-links a:hover {
                                                                                                                                                                                                                                                                                                                    color: #ff5c7a;
                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                    /* HERO */

                                                                                                                                                                                                                                                                                                                    .hero {
                                                                                                                                                                                                                                                                                                                        min-height: 100vh;
                                                                                                                                                                                                                                                                                                                            display: flex;
                                                                                                                                                                                                                                                                                                                                align-items: center;
                                                                                                                                                                                                                                                                                                                                    justify-content: center;
                                                                                                                                                                                                                                                                                                                                        text-align: center;
